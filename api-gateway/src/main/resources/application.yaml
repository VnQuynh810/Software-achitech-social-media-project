server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  redis:
    host: localhost
    port: 6379
  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@myRateLimiter}"

        - id: profile-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/profile/**
          filters:
            - RewritePath=/api/v1/profile/(?<segment>.*), /api/${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@myRateLimiter}"

        - id: post-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - RewritePath=/api/v1/posts/(?<segment>.*), /api/${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@myRateLimiter}"

        - id: like-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/likes/**
          filters:
            - RewritePath=/api/v1/likes/(?<segment>.*), /api/${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@myRateLimiter}"

        - id: follow-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/follows/**
          filters:
            - RewritePath=/api/v1/follows/(?<segment>.*), /api/${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@myRateLimiter}"

        - id: comment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - RewritePath=/api/v1/comments/(?<segment>.*), /api/${segment}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@myRateLimiter}"


logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.data.redis: DEBUG